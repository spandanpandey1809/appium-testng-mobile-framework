# Appium server started with: appium (Appium 2, base path "/")
appium.url=http://127.0.0.1:4723

# App under test: Sauce Labs "My Demo App" for Android (public practice app)
# Download the latest mda-x.y.z.apk from https://github.com/saucelabs/my-demo-app-android/releases
app.path=apps/mda.apk
app.package=com.saucelabs.mydemoapp.android

# Device: emulator name from `adb devices`
device.name=emulator-5554

# Timeouts
explicit.wait.seconds=20
new.command.timeout.seconds=120
